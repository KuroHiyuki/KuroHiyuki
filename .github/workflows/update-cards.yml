name: Update profile cards

on:
  schedule:
    - cron: "0 0 * * *"   # mỗi ngày 00:00 UTC (07:00 giờ Việt Nam)
  workflow_dispatch:       # cho phép bấm chạy tay
  push:
    branches: [main]
    paths: ["scripts/**"]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate cards
        run: python scripts/gen_cards.py
        env:
          GH_USER: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/langs.svg assets/stats.svg
          git diff --staged --quiet || git commit -m "chore: update profile cards"
          git push
