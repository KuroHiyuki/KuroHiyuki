<svg xmlns="http://www.w3.org/2000/svg" width="800" height="260" viewBox="0 0 800 260" role="img" aria-label="Nguyễn Phương, Fullstack Developer">
  <rect width="800" height="260" fill="#FFD43B"/>
  <rect x="2" y="2" width="796" height="256" fill="none" stroke="#000000" stroke-width="4"/>

  <!-- Thẻ chính (đổi chữ trong thẻ này) -->
  <rect x="42" y="42" width="520" height="190" fill="#000000"/>
  <rect x="34" y="34" width="520" height="190" fill="#FFFFFF" stroke="#000000" stroke-width="3"/>

  <g transform="rotate(-3 113 62)">
    <rect x="48" y="48" width="130" height="28" fill="#FF8FAB" stroke="#000000" stroke-width="3"/>
    <text x="113" y="67" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="14" font-weight="700" fill="#000000">HELLO, I'M</text>
  </g>

  <text x="48" y="128" font-family="Arial, Helvetica, sans-serif" font-size="50" font-weight="700" letter-spacing="-2" fill="#000000">Nguyễn Phương</text>

  <rect x="48" y="144" width="226" height="30" fill="#000000"/>
  <text x="60" y="165" font-family="'Courier New', Courier, monospace" font-size="16" font-weight="700" fill="#FFD43B">FULLSTACK DEVELOPER</text>

  <text x="48" y="204" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#000000">Xây dựng ứng dụng web từ backend đến giao diện.</text>

  <!-- Avatar chữ cái (đổi "NP" thành chữ cái của bạn) -->
  <g transform="rotate(3 675 131)">
    <rect x="608" y="64" width="150" height="150" fill="#000000"/>
    <rect x="600" y="56" width="150" height="150" fill="#74C0FC" stroke="#000000" stroke-width="3"/>
    <text x="675" y="150" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="64" font-weight="700" letter-spacing="-3" fill="#000000">NP</text>
  </g>
</svg>
